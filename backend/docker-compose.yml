version: "3.9"

# ─────────────────────────────────────────────
# Named volumes for persistent data
# ─────────────────────────────────────────────
volumes:
  mongo_data:

# ─────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────
services:

  # ── MongoDB Database ──────────────────────
  db:
    image: mongo:7-jammy
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: portfolio
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Portfolio Backend ─────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      SESSION_SECRET: change-me-in-production
      # Use the service name 'db' as the hostname — Docker Compose DNS resolves it
      MONGO_URL: mongodb://db:27017/portfolio
